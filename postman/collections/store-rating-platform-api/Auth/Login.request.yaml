$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
description: |-
  Authenticates user and automatically saves the returned JWT `accessToken` to the collection variable `token`.
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "Password@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var data = pm.response.json();
          if (data.accessToken) {
              pm.collectionVariables.set("token", data.accessToken);
              console.log("Saved accessToken to collection variable 'token'");
          }
      }
