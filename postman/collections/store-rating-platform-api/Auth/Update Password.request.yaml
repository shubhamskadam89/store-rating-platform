$kind: http-request
method: PUT
url: '{{baseUrl}}/auth/password'
order: 4000
description: |-
  Updates password for the currently logged-in user.
  - New password must be 8-16 characters and contain at least 1 uppercase letter and 1 special character.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Password@123",
      "newPassword": "NewPassword@456"
    }
