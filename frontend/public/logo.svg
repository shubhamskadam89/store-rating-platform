<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 12 430 90" width="100%" height="100%" fill="none">
  <!-- Storefront Icon -->
  <g transform="translate(0, 0)">
    <!-- Storefront Frame -->
    <path
      d="M 31 46 L 31 83 C 31 90.7 37.3 97 45 97 L 75 97 C 82.7 97 89 90.7 89 83 L 89 46"
      stroke="#0F172A"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Star Icon (Rating) -->
    <path
      d="M 46 58.5 L 48.8 65.1 L 55.8 65.7 L 50.4 70.4 L 52.1 77.3 L 46 73.4 L 39.9 77.3 L 41.6 70.4 L 36.2 65.7 L 43.2 65.1 Z"
      fill="#0F172A"
    />

    <!-- Feedback / Review Lines -->
    <line x1="64" y1="64" x2="80" y2="64" stroke="#64748B" stroke-width="5" stroke-linecap="round" />
    <line x1="64" y1="74" x2="80" y2="74" stroke="#64748B" stroke-width="5" stroke-linecap="round" />

    <!-- Awning Scallop 1 (Left: #0F172A) -->
    <path
      d="M 23 42 C 21 34 26 23 37 19 C 43 17 46 20 45 25 L 42 43 C 41 49.5 25 49 23 42 Z"
      fill="#0F172A"
    />

    <!-- Awning Scallop 2 (Center: #334155) -->
    <path
      d="M 48 24 C 48 18 53 16 60 16 C 67 16 72 18 72 24 L 70 43 C 69 49.5 51 49.5 50 43 Z"
      fill="#334155"
    />

    <!-- Awning Scallop 3 (Right: #64748B) -->
    <path
      d="M 75 25 C 74 20 77 17 83 19 C 94 23 99 34 97 42 C 95 49 79 49.5 78 43 Z"
      fill="#64748B"
    />
  </g>

  <!-- Wordmark "What They Say" -->
  <text
    x="116"
    y="66"
    font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="44"
    fill="#0F172A"
    letter-spacing="-0.03em"
  >What They Say</text>

  <!-- Tagline "REAL FEEDBACK. STRONGER BUSINESSES." -->
  <text
    x="118"
    y="93"
    font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="11.5"
    fill="#64748B"
    letter-spacing="0.22em"
  >REAL FEEDBACK. STRONGER BUSINESSES.</text>
</svg>
